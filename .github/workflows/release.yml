# A tag v* builds the binaries and attaches them to its GitHub release, where install.sh downloads them from.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../typestrict-${{ matrix.target }}.tar.gz typestrict
          cd ../../..
          shasum -a 256 typestrict-${{ matrix.target }}.tar.gz > typestrict-${{ matrix.target }}.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/typestrict.exe -DestinationPath typestrict-${{ matrix.target }}.zip
          (Get-FileHash typestrict-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  typestrict-${{ matrix.target }}.zip" | Out-File -Encoding ascii typestrict-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: typestrict-${{ matrix.target }}.*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes typestrict-*
